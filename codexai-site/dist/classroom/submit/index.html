<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提交我的作品 · 儿童 AI 创作工作坊</title><link rel="stylesheet" href="../../style.css"><link rel="icon" href="../../assets/favicon.svg">
<style>.submit{max-width:760px}.submit .card{margin:20px 0}.submit small{display:block;margin-top:8px}.result{padding:18px;border-radius:12px;background:#edf2dc;min-height:62px;white-space:pre-wrap}.result.error{background:#f8eae5;color:#8b3326}.qr{max-width:220px;display:block;margin:18px 0}.submit input[type=file]{background:#fff}</style></head>
<body><header><a class="brand" href="/">CODEXAI · 创作工作坊</a><nav><a href="/classroom/">下载起始包</a></nav></header>
<main class="submit"><span class="eyebrow">课程 01 · 交作业</span><h1>把你的作品交给老师</h1><p>先在自己电脑上试一试，再把<strong>整个项目文件夹</strong>压缩成 ZIP。老师会给你作品编号和上传码。</p>
<form id="submit-form" class="card"><label for="code">作品编号</label><input id="code" required autocomplete="off" spellcheck="false" placeholder="例如 c260924-s01" pattern="[a-z][a-z0-9-]{2,30}"><label for="token">上传码</label><input id="token" required autocomplete="off" spellcheck="false" placeholder="老师发给你的上传码"><label for="zip">项目 ZIP 压缩包</label><input id="zip" type="file" accept=".zip,application/zip" required><small class="muted">不超过 25MB；不要上传真实姓名、学校、密码或家庭账目。</small><div class="actions"><button id="send" type="submit">上传给老师</button><button id="check" class="secondary" type="button">查询我的进度</button></div></form>
<div id="result" class="result" role="status" aria-live="polite">等待你提交作品。</div><div id="delivery" hidden class="card"><h2>作品已发布！</h2><p>请让家长用手机浏览器打开这个链接，或扫描二维码。</p><p><a id="work-link" href="#" target="_blank" rel="noopener"></a></p><div class="actions"><button id="copy" type="button">复制家长链接</button></div><img id="qr" class="qr" alt="作品二维码"><p class="muted">首次打开需要联网；按页面提示添加到手机桌面后，请关闭重开并测试。</p></div>
<p class="muted">如果显示“需修改”，按老师的说明修改后重新压缩上传；同一个作品编号可交新版本。</p></main><footer>有问题就举手找老师。</footer><script src="submit.js" defer></script></body></html>
