<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的创作空间 · CODEXAI</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" href="../assets/favicon.svg">
  <style>
    main{max-width:1080px}.portal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .program{padding:28px 0;border-top:1px solid var(--line)}.topic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:18px 0}
    .topic .card{display:flex;flex-direction:column;gap:10px}.topic .actions{margin-top:auto}.topic input[type=file]{max-width:100%}
    .status{display:inline-block;padding:4px 11px;background:#edf2dc;border-radius:50px;width:max-content}.status.published{background:#d9efcb}.status.pending{background:#fff0bd}
    .feedback{padding:12px;border-left:3px solid #d29b30;background:#fff9ea}.create-box{background:#eaf0df;border-radius:18px;padding:24px;margin:18px 0}
    .create-box .fields{grid-template-columns:1fr 1fr}.create-box textarea{width:100%;min-height:88px;padding:11px;border:1px solid #b8c8ba;border-radius:9px;font:inherit;resize:vertical}
    .work-meta{font-size:14px;color:#607166}#message{min-height:40px;color:#8c3f27;font-weight:600}
    @media(max-width:700px){.topic,.create-box .fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><a class="brand" href="https://codexai.site/">CODEXAI · 我的创作空间</a><nav><a href="https://codexai.site/">课程网站</a><a href="https://codexai.site/showcase/">作品展</a></nav></header>
<main>
  <div class="portal-head"><div><span class="eyebrow">我的课程与作品</span><h1>每次创作，都留在这里。</h1><p>上课作品和你自己想做的网页，都可以持续修改、交给老师检查。</p></div></div>
  <section class="card" id="login-card"><h2>登录创作空间</h2><p>使用老师发给你的编号和访问码。以后参加新课，仍用同一账号。</p><div class="fields"><div><label for="code">我的编号</label><input id="code" autocomplete="off" placeholder="例如 c260924a-s01"></div><div><label for="token">访问码</label><input id="token" type="password" autocomplete="off" placeholder="老师发给你的访问码"></div></div><div class="actions"><button id="login">登录</button></div><p class="muted">还没有账号？请找老师领取。不要把访问码发给别人。</p></section>
  <div id="dashboard" hidden>
    <div class="actions"><span id="identity" class="chip"></span><button id="refresh" class="secondary">刷新状态</button><button id="logout" class="secondary">退出</button></div>
    <section class="program" id="free-section"><span class="eyebrow">课后也能继续创作</span><h2>自由创作</h2><p>从你自己发现的问题出发。先建一张作品卡，再上传完整的静态网页 ZIP；每次更新都由老师检查。</p>
      <div class="create-box"><h3>开始一个新作品</h3><div class="fields"><div><label for="free-title">作品名称</label><input id="free-title" maxlength="60" placeholder="例如 我的旅行清单"></div><div><label for="free-category">类别</label><input id="free-category" maxlength="30" placeholder="例如 生活工具、故事、游戏"></div></div><label for="free-summary">它想解决什么问题？</label><textarea id="free-summary" maxlength="300" placeholder="用自己的话写一写，谁会用它、它能帮什么忙。"></textarea><div class="actions"><button id="create-free">创建作品卡</button></div></div>
      <div id="free-works" class="topic"></div>
    </section>
    <section class="program"><span class="eyebrow">老师安排的学习任务</span><h2>我的课程</h2><div id="programs"></div></section>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<footer>请先在电脑上测试作品，再把完整项目文件夹压缩为 ZIP 上传。老师审核后，家长才会收到分享链接。</footer>
<script src="student.js" defer></script>
</body></html>
