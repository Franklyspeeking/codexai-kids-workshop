<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的创作空间 · CODEXAI</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg"><style>main{max-width:1050px}.topic{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}.topic .card{height:100%}.topic .actions{align-items:center}.topic input[type=file]{max-width:350px}.program{padding:24px 0;border-top:1px solid var(--line)}#message{min-height:40px;color:#8c3f27;font-weight:600}.status{display:inline-block;padding:4px 12px;background:#edf2dc;border-radius:50px}.published{background:#d9efcb}.pending{background:#fff0bd}.feedback{padding:12px;border-left:3px solid #d29b30;background:#fff9ea}@media(max-width:700px){.topic{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="https://codexai.site/">CODEXAI · 我的创作空间</a><nav><a href="https://codexai.site/showcase/">作品展</a></nav></header><main><span class="eyebrow">我的课程与作品</span><h1>每次创作，都留在这里。</h1><p>使用老师发给你的编号和访问码登录。以后参加新课或夏令营，继续使用同一个账号。</p><section class="card" id="login-card"><h2>登录</h2><div class="fields"><div><label for="code">我的编号</label><input id="code" autocomplete="off" placeholder="例如 c260924a-s01"></div><div><label for="token">访问码</label><input id="token" type="password" autocomplete="off" placeholder="老师发给你的访问码"></div></div><div class="actions"><button id="login">进入我的课程</button></div><p class="muted">没有账号？向老师领取。不要把访问码发给别人。</p></section><section id="dashboard" hidden><div class="actions"><span id="identity" class="chip"></span><button id="refresh" class="secondary">刷新状态</button><button id="logout" class="secondary">退出</button></div><div id="programs"></div></section><p id="message" role="status" aria-live="polite"></p></main><footer>请先在电脑里打开项目并测试。确认作品可用后，将完整项目文件夹压缩成 ZIP 上传。</footer><script src="student.js" defer></script></body></html>
