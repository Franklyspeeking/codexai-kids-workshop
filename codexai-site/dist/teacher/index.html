<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师工作台 · CODEXAI</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg">
<style>main{max-width:1100px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.toolbar>*{flex:1;min-width:180px}.roster{width:100%;border-collapse:collapse;margin:20px 0;background:#fff}.roster th,.roster td{text-align:left;border-bottom:1px solid #dce4d9;padding:10px;vertical-align:top}.roster td{max-width:300px;overflow-wrap:anywhere}.roster button{font-size:13px;padding:7px 10px;min-height:32px;margin:3px}.roster a{display:block}#message{padding:12px;min-height:44px}#qr-dialog img{max-width:280px}code{font-size:14px}@media(max-width:700px){.roster,.roster thead,.roster tbody,.roster tr,.roster td{display:block}.roster thead{display:none}.roster tr{border:1px solid #dce4d9;margin:12px 0;padding:8px}.roster td{border:0;padding:5px}}</style></head>
<body><header><a class="brand" href="/">CODEXAI · 教师工作台</a><nav><a href="/classroom/submit/">学生提交页</a></nav></header><main><span class="eyebrow">课堂收件与发布</span><h1>全班作品，一处查看。</h1><p>学生上传后先进入待审核。请先打开预览、测试记账，再决定发布或退回修改。</p>
<section class="card"><h2>登录教师工作台</h2><label for="key">教师密钥</label><input id="key" type="password" autocomplete="off" placeholder="输入部署时保存的教师密钥"><div class="actions"><button id="login">进入工作台</button><button id="logout" class="secondary">退出</button></div><p class="muted">密钥只保留在当前页面内存中，刷新页面后需要重输。请勿投屏显示密钥或学生上传码。</p></section>
<section id="dashboard" hidden><section class="card"><h2>开一个新班级</h2><div class="toolbar"><div><label for="class-id">班级编号</label><input id="class-id" placeholder="例如 c260924a" pattern="[a-z][a-z0-9-]{2,16}"></div><div><label for="count">学生人数</label><input id="count" type="number" min="1" max="25" value="20"></div><div><button id="create">生成编号和上传码</button></div></div><p class="muted">每班使用新编号。生成后下载名单，填写孩子与家长的对应关系，并把各自的编号和上传码发给孩子。</p></section>
<div class="toolbar"><div><label for="filter-class">当前查看的班级</label><select id="filter-class"></select></div><div class="actions"><button id="refresh" class="secondary">刷新全班状态</button><button id="csv" class="secondary">下载本班编号与上传码名单</button></div></div><p id="message" role="status" aria-live="polite"></p><div style="overflow-x:auto"><table class="roster"><thead><tr><th>作品编号／上传码</th><th>状态</th><th>审核与发布</th><th>家长链接</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">家长链接只在老师确认发布后出现。二维码适合让家长现场扫描；如果链接发到家长自己的手机，请直接点开链接。</p></section>
<dialog id="qr-dialog"><h2>家长扫码</h2><img id="qr-image" alt="作品二维码"><p id="qr-link"></p><button id="qr-close">关闭</button></dialog></main><footer>孩子的真实姓名和家长联系方式只填写在老师自己保存的名单里。</footer><script src="teacher.js" defer></script></body></html>
