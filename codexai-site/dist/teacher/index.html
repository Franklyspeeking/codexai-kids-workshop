<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教师登录 · Code-X-Ai</title>
  <meta name="description" content="Code-X-Ai 教师管理后台登录">
  <link rel="icon" href="../assets/code-x-ai-logo.png">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="teacher-login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="form-title">
      <a class="login-brand" href="https://codexai.site/" aria-label="返回 Code-X-Ai 首页">
        <span class="brand-mark">CX</span>
        <span><strong>Code-X-Ai</strong><small>教师工作台</small></span>
      </a>
      <div>
        <span class="eyebrow">欢迎回来</span>
        <h2 id="form-title">登录教师后台</h2>
        <p class="muted">使用教师账号和管理密码继续。</p>
      </div>
      <form id="login-form" novalidate>
        <label for="username">教师账号</label>
        <input id="username" name="username" autocomplete="username" value="admin" required>
        <label for="password">管理密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button id="toggle-password" class="text-button" type="button" aria-label="显示密码">显示</button>
        </div>
        <button id="login-button" class="primary wide" type="submit">进入工作台</button>
        <p id="message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="login-help">账号仅供教师管理使用。请勿把管理密码发送给学生或家长。</p>
      <div class="login-links"><a href="https://codexai.site/">返回公开网站</a></div>
    </section>
  </main>
  <script src="teacher.js" defer></script>
</body>
</html>
