<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>家务积分银行 · 我的家庭贡献</title>
<style>
:root{
  --bg:#F2F7F3;--card:#FFFFFF;--ink:#2C3A2F;--muted:#7C8A80;--line:#DCE7DF;
  --green:#2E7D4F;--green-bg:#E3F2E8;--gold:#B8860B;--gold-bg:#FBF3DC;
  --red:#C0392B;--red-bg:#FCEAE8;--blue:#2C5F8A;--blue-bg:#E7F0F7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:16px 14px 90px;
  -webkit-tap-highlight-color:transparent;font-size:15px}
h1,h2,h3{font-size:16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 10px}
.h-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h-title{flex:1}
.h-title .t1{font-size:17px;font-weight:700}
.h-title .t2{font-size:12px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green-bg);display:flex;
  align-items:center;justify-content:center;font-size:20px;border:2px solid var(--green)}
.h-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;color:var(--green)}
.stat .n.gold{color:var(--gold)}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:11px 0 9px;font-size:12px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--green);font-weight:700}
nav button .ic{display:block;font-size:20px;margin-bottom:1px}
section{display:none;animation:fade .25s}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto}
.chore{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.chore:last-child{border-bottom:none}
.chore .emo{font-size:26px;width:34px;text-align:center}
.chore .c-main{flex:1;min-width:0}
.chore .c-t{font-weight:600;font-size:14px}
.chore .c-m{font-size:11px;color:var(--muted);margin-top:2px}
.chore .btn{padding:7px 11px;font-size:12px;flex-shrink:0}
.reward .r-t .r-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{font-weight:800;color:var(--green);white-space:nowrap}
.pt.zero{color:var(--muted);font-weight:600}
.btn{border:none;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:var(--green-bg);color:var(--green)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.big{width:100%;padding:13px;font-size:15px;border-radius:24px}
.btn:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:600}
.badge.duty{background:var(--blue-bg);color:var(--blue)}
.badge.daily{background:var(--gold-bg);color:var(--gold)}
.badge.once{background:#EFE9DA;color:#8A7A4A}
.badge.pending{background:var(--gold-bg);color:var(--gold)}
.badge.done{background:var(--green-bg);color:var(--green)}
.pending-bar{background:var(--gold-bg);border:1px solid #EAD9A8;border-radius:14px;padding:12px;margin-bottom:12px}
.pending-bar .pt-t{font-weight:700;color:var(--gold);font-size:13px;margin-bottom:4px}
.pending-bar .pt-d{font-size:12px;color:#8A7A3A}
.tx{display:flex;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tx:last-child{border-bottom:none}
.tx .t-d{width:74px;color:var(--muted);font-size:11px}
.tx .t-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t-v{font-weight:800}
.tx .t-v.plus{color:var(--green)}
.tx .t-v.minus{color:var(--red)}
.reward{padding:12px 0;border-bottom:1px dashed var(--line)}
.reward:last-child{border-bottom:none}
.reward .r-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.reward .r-cost{margin-left:auto;color:var(--green);font-weight:800}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:8px;background:var(--green);border-radius:4px;transition:width .4s}
.reward .r-sub{font-size:11px;color:var(--muted);margin-top:5px}
.rule-box{background:var(--blue-bg);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--blue);line-height:1.7;margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(30,40,32,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px 26px;max-height:88vh;display:flex;flex-direction:column}
.sheet h3{margin-bottom:12px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--green-bg);color:var(--green);border-color:var(--green);font-weight:700}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.member-chip{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.member-chip .mc-emo{font-size:22px}
.member-chip .mc-main{flex:1}
.member-chip .mc-n{font-weight:600;font-size:14px}
.member-chip .mc-b{font-size:11px;color:var(--muted)}
.member-chip .mc-bal{font-weight:800;color:var(--green)}
.toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(44,58,47,.92);
  color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;z-index:99;animation:fade .2s;white-space:nowrap}
.confetti{position:fixed;top:-12px;font-size:18px;z-index:60;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.sum-item .n{font-size:22px;font-weight:800;color:var(--green)}
.sum-item .l{font-size:11px;color:var(--muted);margin-top:2px}
footer{text-align:center;font-size:11px;color:var(--muted);padding:16px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;
  border-radius:8px;background:var(--bg);color:var(--muted)}
.cal div.hit{background:var(--green);color:#fff;font-weight:700}
.cal div.today{outline:2px solid var(--gold)}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="avatar" id="h-avatar">👧</div>
    <div class="h-title">
      <div class="t1" id="h-name">我的家庭贡献</div>
      <div class="t2" id="h-role">点击右上角头像切换家人</div>
    </div>
    <button class="btn ghost" id="btn-switch">切换</button>
  </div>
  <div class="h-stats">
    <div class="stat"><div class="n" id="hs-bal">0</div><div class="l">可兑换积分</div></div>
    <div class="stat"><div class="n gold" id="hs-honor">0</div><div class="l">荣誉总分</div></div>
    <div class="stat"><div class="n" id="hs-pending">0</div><div class="l">待存入</div></div>
  </div>
</header>

<section id="view-chores" class="on">
  <div class="pending-bar" id="pend-bar" style="display:none">
    <div class="pt-t" id="pend-t"></div>
    <div class="pt-d">做完的家务等家长确认后，积分才会存进银行</div>
  </div>
  <div class="card">
    <h3>🏡 今日家务 <span class="sub" id="chore-count"></span></h3>
    <div id="chore-list"></div>
    <button class="btn ghost big" id="btn-add-chore" style="margin-top:10px">＋ 添加家务</button>
  </div>
  <div class="rule-box" id="rule-box"></div>
</section>

<section id="view-bank">
  <div class="card">
    <h3>🏦 积分存折</h3>
    <div class="h-stats" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
      <div class="stat"><div class="n" id="bk-bal">0</div><div class="l">可兑换积分</div></div>
      <div class="stat"><div class="n gold" id="bk-honor">0</div><div class="l">荣誉总分（永不清零）</div></div>
    </div>
    <div id="tx-list"></div>
  </div>
  <div class="card">
    <h3>📅 近 14 天打卡日历</h3>
    <div class="cal" id="cal"></div>
  </div>
</section>

<section id="view-rewards">
  <div class="card">
    <h3>🎁 奖励商店 <span class="sub">攒够积分就能兑换</span></h3>
    <div id="reward-list"></div>
    <button class="btn ghost big" id="btn-add-reward" style="margin-top:10px">＋ 添加奖励</button>
  </div>
  <div class="card" id="redeem-pend-card" style="display:none">
    <h3>⏳ 待家长确认的兑换</h3>
    <div id="redeem-pend-list"></div>
  </div>
</section>

<section id="view-parent">
  <div class="card">
    <h3>👨‍👩‍👧 家长台 · 待确认 <span class="sub" id="parent-pend-count"></span></h3>
    <div id="confirm-list"></div>
  </div>
  <div class="card">
    <h3>💼 全家总览</h3>
    <div id="family-overview"></div>
    <div style="margin-top:10px">
      <h3 style="font-size:13px;margin:10px 0 6px">⭐ 加奖励分</h3>
      <div class="fld"><select id="bonus-member"></select></div>
      <div class="fld"><input id="bonus-desc" placeholder="奖励原因，如：期中考进步"></div>
      <div class="fld"><input id="bonus-pts" type="number" placeholder="分值（如 10）" min="1"></div>
      <button class="btn primary" id="btn-bonus">存入奖励分</button>
    </div>
  </div>
  <div class="card">
    <h3>⚙️ 其他</h3>
    <button class="btn ghost" id="btn-reset" style="width:100%">清空所有数据重新开始</button>
  </div>
</section>

<nav>
  <button class="on" data-tab="chores"><span class="ic">🏡</span>今日家务</button>
  <button data-tab="bank"><span class="ic">🏦</span>积分存折</button>
  <button data-tab="rewards"><span class="ic">🎁</span>奖励商店</button>
  <button data-tab="parent"><span class="ic">👨‍👩‍👧</span>家长台</button>
</nav>

<div class="modal" id="m-chore"><div class="sheet">
  <h3>➕ 添加家务</h3>
  <div class="fld"><label>家务名称</label><input id="c-title" placeholder="比如：和家人一起洗碗"></div>
  <div class="fld"><label>家务性质</label>
    <div class="seg" id="c-kind">
      <button data-v="duty">本分家务 · 0分<br><span style="font-size:10px">家人应尽的义务</span></button>
      <button data-v="extra" class="on">加分家务 · 挣积分<br><span style="font-size:10px">额外的贡献</span></button>
    </div>
  </div>
  <div class="fld" id="c-pts-wrap"><label>积分</label><input id="c-pts" type="number" value="5" min="1"></div>
  <div class="fld"><label>重复方式</label>
    <div class="seg" id="c-repeat">
      <button data-v="daily" class="on">每日家务（明天再来）</button>
      <button data-v="once">一次性（做完消失）</button>
    </div>
  </div>
  <div class="fld"><label>图标</label><select id="c-emo"></select></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="c-cancel">取消</button>
    <button class="btn primary" id="c-save">保存</button>
  </div>
</div></div>

<div class="modal" id="m-reward"><div class="sheet">
  <h3>🎁 添加奖励</h3>
  <div class="fld"><label>奖励名称</label><input id="r-title" placeholder="比如：看 30 分钟动画片"></div>
  <div class="fld"><label>所需积分</label><input id="r-cost" type="number" value="20" min="1"></div>
  <div class="fld"><label>图标</label><select id="r-emo"></select></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="r-cancel">取消</button>
    <button class="btn primary" id="r-save">保存</button>
  </div>
</div></div>

<div class="modal" id="m-member"><div class="sheet">
  <h3>👤 切换身份</h3>
  <div id="member-list"></div>
  <div class="sheet-actions" style="margin-top:4px">
    <button class="btn ghost" id="m-cancel">取消</button>
    <button class="btn primary" id="m-new">➕ 新家人</button>
  </div>
</div></div>

<div class="modal" id="m-newmember"><div class="sheet">
  <h3>➕ 新家人</h3>
  <div class="fld"><label>名字</label><input id="nm-name" placeholder="比如：妹妹"></div>
  <div class="fld"><label>头像</label><select id="nm-emo"></select></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="nm-cancel">取消</button>
    <button class="btn primary" id="nm-save">创建</button>
  </div>
</div></div>

<footer>家务积分银行 · 数据只保存在本机浏览器 · 挣到的积分永远不会扣回</footer>

<script>
"use strict";
const KEY='chore-bank:v1';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const EMOJIS_CHORE=['🧹','🧽','🍽️','🗑️','🪴','🛏️','📚','👕','🐾','📦','🚪','💧'];
const EMOJIS_FACE=['👧','👦','🧑','👩','👨','👵','👴','🧒'];
const EMOJIS_REWARD=['📺','🎡','🍦','🎬','🎮','⚽','🎨','🍕','🧸','🚗'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function seed(){
  return {
    members:[{id:'m1',name:'我',emoji:'👧'},{id:'m2',name:'爸爸',emoji:'👨'}],
    current:'m1',
    chores:[
      {id:uid(),title:'整理自己的书桌',pts:0,kind:'duty',repeat:'daily',emo:'🛏️'},
      {id:uid(),title:'和家人一起洗碗',pts:8,kind:'extra',repeat:'daily',emo:'🍽️'},
      {id:uid(),title:'照顾阳台植物',pts:3,kind:'extra',repeat:'daily',emo:'🪴'},
      {id:uid(),title:'倒垃圾',pts:2,kind:'extra',repeat:'daily',emo:'🗑️'}
    ],
    records:[
      {id:uid(),choreId:null,mId:'m1',date:daysAgo(1),status:'confirmed',pts:8,desc:'和家人一起洗碗',by:'爸爸'},
      {id:uid(),choreId:null,mId:'m1',date:daysAgo(2),status:'confirmed',pts:3,desc:'照顾阳台植物',by:'爸爸'},
      {id:uid(),choreId:null,mId:'m1',date:daysAgo(3),status:'confirmed',pts:2,desc:'倒垃圾',by:'爸爸'},
      {id:uid(),choreId:null,mId:'m2',date:daysAgo(1),status:'confirmed',pts:8,desc:'和家人一起洗碗',by:'我'}
    ],
    txs:{
      m1:[
        {id:uid(),date:daysAgo(1),desc:'和家人一起洗碗',delta:8,kind:'earn'},
        {id:uid(),date:daysAgo(2),desc:'照顾阳台植物',delta:3,kind:'earn'},
        {id:uid(),date:daysAgo(3),desc:'倒垃圾',delta:2,kind:'earn'}
      ],
      m2:[{id:uid(),date:daysAgo(1),desc:'和家人一起洗碗',delta:8,kind:'earn'}]
    },
    rewards:[
      {id:uid(),title:'看 30 分钟动画片',cost:20,emo:'📺'},
      {id:uid(),title:'周末去游乐园',cost:100,emo:'🎡'},
      {id:uid(),title:'选一顿周末晚餐',cost:50,emo:'🍕'}
    ],
    redemptions:[]
  };
}

let state;
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.members)return s}catch(e){}
  return seed();
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
window.__state=()=>state;

function me(){return state.members.find(m=>m.id===state.current)||state.members[0]}
function myTx(){if(!state.txs[state.current])state.txs[state.current]=[];return state.txs[state.current]}
function balance(id){const t=state.txs[id||state.current]||[];return t.reduce((s,x)=>s+x.delta,0)}
function honor(id){const t=state.txs[id||state.current]||[];return t.reduce((s,x)=>s+(x.delta>0?x.delta:0),0)}
function pendingPts(id){return state.records.filter(r=>r.mId===(id||state.current)&&r.status==='pending').reduce((s,r)=>s+r.pts,0)}

function choreVisible(c,mid){
  if(c.repeat==='once')return !state.records.some(r=>r.mId===mid&&r.choreId===c.id&&r.status==='confirmed');
  return !state.records.some(r=>r.mId===mid&&r.choreId===c.id&&r.date===today());
}

function streak(mid){
  const days=new Set(state.records.filter(r=>r.mId===mid&&r.status==='confirmed').map(r=>r.date));
  let n=0,d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  while(true){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break;
  }
  return n;
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}
function confetti(){
  const emos=['🎉','✨','🌟','💰','🎊'];
  for(let i=0;i<14;i++){const s=document.createElement('div');s.className='confetti';
    s.textContent=emos[Math.floor(Math.random()*emos.length)];s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*0.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}
}

function openModal(sel){$(sel).classList.add('on')}
function closeModal(sel){$(sel).classList.remove('on')}
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));

/* ===== 渲染 ===== */
function render(){
  const m=me();
  $('#h-avatar').textContent=m.emoji;
  $('#h-name').textContent=m.name+'的家庭贡献';
  $('#h-role').textContent='积分银行 · 荣誉 '+honor()+' 分';
  $('#hs-bal').textContent=balance();
  $('#hs-honor').textContent=honor();
  $('#hs-pending').textContent=pendingPts();
  renderChores();renderBank();renderRewards();renderParent();renderRule();
}

function renderRule(){
  const dutyCnt=state.chores.filter(c=>c.kind==='duty').length;
  $('#rule-box').innerHTML='📌 <b>家庭公约</b>：本分家务（'+dutyCnt+' 件）是每个家人的义务，不积分；加分家务挣积分，家长确认后存入银行。挣到的积分永远不会扣回，但兑换奖励会减少可兑换余额。';
}

function renderChores(){
  const mid=state.current;
  const list=state.chores.filter(c=>choreVisible(c,mid));
  $('#chore-count').textContent=list.length+' 件待做';
  if(!list.length){$('#chore-list').innerHTML='<div class="empty">今天的家务都做完啦，真棒！🎉</div>';return}
  $('#chore-list').innerHTML=list.map(c=>{
    const ptsHtml=c.kind==='duty'?'<span class="pt zero">本分</span>':'<span class="pt">+'+c.pts+'</span>';
    const kindTag=c.repeat==='daily'?'<span class="badge daily">每日</span>':'<span class="badge once">一次性</span>';
    return `<div class="chore">
      <div class="emo">${c.emo}</div>
      <div class="c-main"><div class="c-t">${esc(c.title)}</div>
        <div class="c-m">${kindTag} ${c.kind==='duty'?'家人义务 · 0分':'待确认后 +'+c.pts+' 分'}</div></div>
      ${ptsHtml}
      <button class="btn primary" data-done="${c.id}">做完了</button>
    </div>`;
  }).join('');
  const pend=pendingPts();
  $('#pend-bar').style.display=pend>0?'block':'none';
  $('#pend-t').textContent='⏳ '+pend+' 分待存入 · '+state.records.filter(r=>r.mId===mid&&r.status==='pending').length+' 件家务等家长确认';
}

function renderBank(){
  $('#bk-bal').textContent=balance();
  $('#bk-honor').textContent=honor();
  const txs=myTx().slice().reverse().slice(0,30);
  $('#tx-list').innerHTML=txs.length?txs.map(t=>`<div class="tx">
    <div class="t-d">${t.date.slice(5)}</div>
    <div class="t-desc">${esc(t.desc)}${t.kind==='bonus'?' ⭐':''}</div>
    <div class="t-v ${t.delta>=0?'plus':'minus'}">${t.delta>=0?'+':''}${t.delta}</div>
  </div>`).join(''):'<div class="empty">存折还是空的，做完家务就有收入啦</div>';
  const days=new Set(state.records.filter(r=>r.mId===state.current&&r.status==='confirmed').map(r=>r.date));
  let html='';
  for(let i=13;i>=0;i--){
    const k=daysAgo(i);
    html+=`<div class="${days.has(k)?'hit':''} ${k===today()?'today':''}">${Number(k.slice(8))}</div>`;
  }
  $('#cal').innerHTML='<div style="font-size:10px">一</div><div style="font-size:10px">二</div><div style="font-size:10px">三</div><div style="font-size:10px">四</div><div style="font-size:10px">五</div><div style="font-size:10px">六</div><div style="font-size:10px">日</div>'+html;
}

function renderRewards(){
  const bal=balance();
  const pend=state.redemptions.filter(r=>r.status==='pending');
  $('#redeem-pend-card').style.display=pend.length?'block':'none';
  $('#redeem-pend-list').innerHTML=pend.map(r=>{
    const rw=state.rewards.find(x=>x.id===r.rewardId);
    const mm=state.members.find(x=>x.id===r.mId);
    return `<div class="tx"><div class="t-d">${r.date.slice(5)}</div>
      <div class="t-desc">${mm?mm.name:'?'} · ${rw?rw.emo+' '+esc(rw.title):'?'}（${rw?rw.cost:0}分）</div>
      <div class="t-v" style="color:var(--gold)">待确认</div></div>`;
  }).join('');
  $('#reward-list').innerHTML=state.rewards.map(r=>{
    const pct=Math.min(100,Math.round(bal/r.cost*100));
    const can=bal>=r.cost;
    return `<div class="reward">
      <div class="r-t"><span style="font-size:22px">${r.emo}</span><span class="r-title">${esc(r.title)}</span><span class="r-cost">${r.cost} 分</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="r-sub">${can?'已攒够，可以兑换！':'已攒 '+bal+' 分，还差 '+(r.cost-bal)+' 分'}</div>
      <button class="btn ${can?'primary':'ghost'}" data-redeem="${r.id}" style="margin-top:8px" ${can?'':'disabled'}>${can?'发起兑换申请':'积分还不够'}</button>
    </div>`;
  }).join('')||'<div class="empty">还没有奖励，让家长添加几个吧</div>';
}

function renderParent(){
  const pend=state.records.filter(r=>r.status==='pending');
  const pendR=state.redemptions.filter(r=>r.status==='pending');
  $('#parent-pend-count').textContent=pend.length+pendR.length+' 项';
  const html=[]
    .concat(pend.map(r=>{
      const mm=state.members.find(x=>x.id===r.mId);
      return `<div class="chore"><div class="emo">${r.pts>0?'💪':'🏡'}</div>
        <div class="c-main"><div class="c-t">${mm?mm.emoji+' '+mm.name:'?'} · ${esc(r.desc)}</div>
        <div class="c-m">${r.date} · ${r.pts>0?'+'+r.pts+' 分':'本分家务'}</div></div>
        <button class="btn primary" data-confirm-rec="${r.id}">确认 ✓</button>
        <button class="btn danger" data-reject-rec="${r.id}">退回</button></div>`;
    }))
    .concat(pendR.map(r=>{
      const rw=state.rewards.find(x=>x.id===r.rewardId);
      const mm=state.members.find(x=>x.id===r.mId);
      return `<div class="chore"><div class="emo">${rw?rw.emo:'🎁'}</div>
        <div class="c-main"><div class="c-t">${mm?mm.emoji+' '+mm.name:'?'} 想兑换「${rw?esc(rw.title):'?'}」</div>
        <div class="c-m">${r.date} · 花费 ${rw?rw.cost:0} 分</div></div>
        <button class="btn primary" data-confirm-red="${r.id}">同意 ✓</button>
        <button class="btn danger" data-reject-red="${r.id}">拒绝</button></div>`;
    }));
  $('#confirm-list').innerHTML=html.join('')||'<div class="empty">暂无待确认事项</div>';
  $('#family-overview').innerHTML=state.members.map(m=>{
    const s=streak(m.id);
    return `<div class="member-chip"><div class="mc-emo">${m.emoji}</div>
      <div class="mc-main"><div class="mc-n">${esc(m.name)}${m.id===state.current?'（当前）':''}</div>
      <div class="mc-b">荣誉 ${honor(m.id)} 分 · 连续 ${s} 天</div></div>
      <div class="mc-bal">${balance(m.id)} 分</div></div>`;
  }).join('');
  $('#bonus-member').innerHTML=state.members.map(m=>`<option value="${m.id}">${m.emoji} ${esc(m.name)}</option>`).join('');
  $('#bonus-member').value=state.current;
}

/* ===== 事件 ===== */
$$('nav button').forEach(b=>b.addEventListener('click',()=>{
  $$('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $$('section').forEach(s=>s.classList.remove('on'));
  $('#view-'+b.dataset.tab).classList.add('on');
}));

document.body.addEventListener('click',e=>{
  const t=e.target.closest('[data-done]');
  if(t){
    const c=state.chores.find(x=>x.id===t.dataset.done);
    if(!c)return;
    state.records.push({id:uid(),choreId:c.id,mId:state.current,date:today(),status:'pending',pts:c.pts,desc:c.title,by:null});
    save();toast(c.pts>0?'已记录！等家长确认 +'+c.pts+' 分':'已记录！这是家人的本分 👍');render();
    return;
  }
  const cr=e.target.closest('[data-confirm-rec]');
  if(cr){
    const r=state.records.find(x=>x.id===cr.dataset.confirmRec);
    if(!r)return;
    r.status='confirmed';r.by=me().name;r.dateConfirmed=today();
    if(r.pts>0){
      if(!state.txs[r.mId])state.txs[r.mId]=[];
      state.txs[r.mId].push({id:uid(),date:today(),desc:r.desc,delta:r.pts,kind:'earn'});
    }
    save();toast('已确认！'+(r.pts>0?'+'+r.pts+' 分已存入银行':'本分家务完成 💪'));
    if(r.pts>0&&r.mId===state.current)confetti();
    render();return;
  }
  const rj=e.target.closest('[data-reject-rec]');
  if(rj){
    state.records=state.records.filter(x=>x.id!==rj.dataset.rejectRec);
    save();toast('已退回，可以重新做');render();return;
  }
  const cd=e.target.closest('[data-confirm-red]');
  if(cd){
    const rd=state.redemptions.find(x=>x.id===cd.dataset.confirmRed);
    const rw=state.rewards.find(x=>x.id===rd.rewardId);
    if(balance(rd.mId)<rw.cost){toast('积分不够了，无法兑换');rd.status='rejected';save();render();return}
    if(!state.txs[rd.mId])state.txs[rd.mId]=[];
    state.txs[rd.mId].push({id:uid(),date:today(),desc:'兑换：'+rw.title,delta:-rw.cost,kind:'spend'});
    rd.status='done';rd.doneDate=today();
    save();toast('兑换成功！享受奖励吧 🎁');confetti();render();return;
  }
  const rdd=e.target.closest('[data-reject-red]');
  if(rdd){
    const rd=state.redemptions.find(x=>x.id===rdd.dataset.rejectRed);
    rd.status='rejected';
    save();toast('已拒绝，积分没有变化');render();return;
  }
  const rd2=e.target.closest('[data-redeem]');
  if(rd2){
    const rw=state.rewards.find(x=>x.id===rd2.dataset.redeem);
    if(balance()<rw.cost){toast('积分还不够，再攒攒！');return}
    state.redemptions.push({id:uid(),rewardId:rw.id,mId:state.current,date:today(),status:'pending'});
    save();toast('申请已发出，等家长确认 🎁');render();return;
  }
});

/* 添加家务 */
let cKind='extra',cRepeat='daily';
$('#btn-add-chore').addEventListener('click',()=>{
  $('#c-title').value='';$('#c-pts').value=5;cKind='extra';cRepeat='daily';
  $$('#c-kind button').forEach(b=>b.classList.toggle('on',b.dataset.v==='extra'));
  $$('#c-repeat button').forEach(b=>b.classList.toggle('on',b.dataset.v==='daily'));
  $('#c-pts-wrap').style.display='block';
  $('#c-emo').innerHTML=EMOJIS_CHORE.map(e=>`<option>${e}</option>`).join('');
  openModal('#m-chore');
});
$('#c-kind').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  cKind=b.dataset.v;$$('#c-kind button').forEach(x=>x.classList.toggle('on',x===b));
  $('#c-pts-wrap').style.display=cKind==='duty'?'none':'block';});
$('#c-repeat').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  cRepeat=b.dataset.v;$$('#c-repeat button').forEach(x=>x.classList.toggle('on',x===b));});
$('#c-cancel').addEventListener('click',()=>closeModal('#m-chore'));
$('#c-save').addEventListener('click',()=>{
  const title=$('#c-title').value.trim();
  if(!title){toast('家务名称不能为空');return}
  const pts=cKind==='duty'?0:Math.max(1,Number($('#c-pts').value)||1);
  state.chores.push({id:uid(),title,pts,kind:cKind,repeat:cRepeat,emo:$('#c-emo').value});
  save();closeModal('#m-chore');toast('家务已添加');render();
});

/* 添加奖励 */
$('#btn-add-reward').addEventListener('click',()=>{
  $('#r-title').value='';$('#r-cost').value=20;
  $('#r-emo').innerHTML=EMOJIS_REWARD.map(e=>`<option>${e}</option>`).join('');
  openModal('#m-reward');
});
$('#r-cancel').addEventListener('click',()=>closeModal('#m-reward'));
$('#r-save').addEventListener('click',()=>{
  const title=$('#r-title').value.trim();
  if(!title){toast('奖励名称不能为空');return}
  const cost=Math.max(1,Number($('#r-cost').value)||1);
  state.rewards.push({id:uid(),title,cost,emo:$('#r-emo').value});
  save();closeModal('#m-reward');toast('奖励已添加');render();
});

/* 切换成员 */
$('#btn-switch').addEventListener('click',()=>{
  $('#member-list').innerHTML=state.members.map(m=>`<div class="member-chip" data-member="${m.id}" style="cursor:pointer">
    <div class="mc-emo">${m.emoji}</div>
    <div class="mc-main"><div class="mc-n">${esc(m.name)}</div><div class="mc-b">可兑换 ${balance(m.id)} 分 · 荣誉 ${honor(m.id)} 分</div></div>
    ${m.id===state.current?'<span class="badge done">当前</span>':''}
  </div>`).join('');
  openModal('#m-member');
});
$('#m-cancel').addEventListener('click',()=>closeModal('#m-member'));
$('#member-list').addEventListener('click',e=>{
  const c=e.target.closest('[data-member]');if(!c)return;
  state.current=c.dataset.member;save();closeModal('#m-member');render();
});
$('#m-new').addEventListener('click',()=>{
  $('#nm-name').value='';
  $('#nm-emo').innerHTML=EMOJIS_FACE.map(e=>`<option>${e}</option>`).join('');
  closeModal('#m-member');openModal('#m-newmember');
});
$('#nm-cancel').addEventListener('click',()=>closeModal('#m-newmember'));
$('#nm-save').addEventListener('click',()=>{
  const name=$('#nm-name').value.trim();
  if(!name){toast('名字不能为空');return}
  const m={id:uid(),name,emoji:$('#nm-emo').value};
  state.members.push(m);state.current=m.id;
  save();closeModal('#m-newmember');toast('欢迎新家人 '+name+'！');render();
});

/* 奖励分 */
$('#btn-bonus').addEventListener('click',()=>{
  const id=$('#bonus-member').value;
  const desc=$('#bonus-desc').value.trim()||'额外奖励';
  const pts=Math.max(1,Number($('#bonus-pts').value)||0);
  if(!pts){toast('请填写分值');return}
  if(!state.txs[id])state.txs[id]=[];
  state.txs[id].push({id:uid(),date:today(),desc,delta:pts,kind:'bonus'});
  save();toast('+'+pts+' 奖励分已存入');render();
});

/* 清档 */
$('#btn-reset').addEventListener('click',()=>{
  if(!confirm('确定清空所有数据重新开始吗？'))return;
  localStorage.removeItem(KEY);state=seed();save();toast('已重新开始');render();
});

/* ===== 初始化 ===== */
state=load()||seed();save();render();
</script>
</body>
</html>
